<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AutoCare Türkiye</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <nav class="u-admin-nav navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <span class="u-orange">/</span> ADMIN CONSOLE
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small d-none d-md-block" id="adminScopeLabel">Administrator</span>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm px-3">
                    LOGOUT <i class="fa-solid fa-power-off ms-2"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="u-page-offset container-fluid px-4">
        
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <small class="text-muted text-uppercase">Total Appointments</small>
                    <h2 class="fw-bold text-white m-0 mt-2" id="statTotal">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <small class="text-muted text-uppercase">Pending Approval</small>
                    <h2 class="fw-bold text-warning m-0 mt-2" id="statPending">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <small class="text-muted text-uppercase">Completed Jobs</small>
                    <h2 class="fw-bold text-success m-0 mt-2" id="statCompleted">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <small class="text-muted text-uppercase">Revenue (30 days)</small>
                    <h2 class="fw-bold text-white m-0 mt-2" id="statRevenue">0 ₺</h2>
                </div>
            </div>
        </div>

        <div class="card border-secondary bg-dark">
            <div class="card-header border-secondary bg-transparent py-3 d-flex justify-content-between align-items-center">
                <h5 class="text-white fw-bold m-0" id="tableTitle">
                    <i class="fa-solid fa-list-check me-2"></i>ACTIVE REQUESTS
                </h5>
                
                <button id="toggleViewBtn" class="btn btn-outline-warning btn-sm fw-bold px-3">
                    <i class="fa-solid fa-clock-rotate-left me-2"></i>VIEW COMPLETED JOBS
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-hover table-custom mb-0">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>CUSTOMER</th>
                            <th>VEHICLE</th>
                            <th>SERVICES</th>
                            <th>PRICE</th>
                            <th>NOTE</th>
                            <th>STATUS</th>
                            <th class="text-end">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="u-z-toast toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="u-toast-head toast-header border-bottom border-secondary">
                <strong class="me-auto" id="toastTitle">System</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="u-toast-body toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script> 
    <script src="admin.js"></script>
</body>
</html>
