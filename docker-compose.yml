# AutoCare Türkiye (AutoCareHub v2).
# - db: reachable only inside Docker networks (no published port). On the shared network
#   `autocare_shared` (create once: docker network create autocare_shared) it is `autocare-db:5432`,
#   which is how the SQLBuddy Appliance on the same host reaches it.
# - app: the website + API, published on 127.0.0.1:3000 only (a reverse proxy / tunnel goes in front).
# Load data with: seed/load.sh --yes      Tests: docker compose --profile test run --rm test
name: autocarehub

x-node-image: &node-image node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0

x-app-env: &app-env
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: autocare
  PGUSER: autocare_app
  AUTOCARE_APP_PASSWORD: ${AUTOCARE_APP_PASSWORD:?set AUTOCARE_APP_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  db:
    # postgres:16 (16.16), multi-arch index digest
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - timezone=Europe/Istanbul
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default: {}
      autocare_shared:
        aliases: [autocare-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    image: autocarehub-app:local
    restart: unless-stopped
    environment:
      <<: *app-env
      NODE_ENV: production
      PORT: "3000"
      STATIC_DIR: /app/public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API tests against the running db (not started by `up`): docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: *node-image
    working_dir: /app
    environment:
      <<: *app-env
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in .env}
      STATIC_DIR: /site
    volumes:
      - ./backend:/app
      - test_node_modules:/app/node_modules
      - ./index.html:/site/index.html:ro
      - ./register.html:/site/register.html:ro
      - ./dashboard.html:/site/dashboard.html:ro
      - ./appointment.html:/site/appointment.html:ro
      - ./admin.html:/site/admin.html:ro
      - ./main.js:/site/main.js:ro
      - ./admin.js:/site/admin.js:ro
      - ./style.css:/site/style.css:ro
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && node --test --test-reporter=spec test/"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  test_node_modules:

networks:
  autocare_shared:
    external: true
