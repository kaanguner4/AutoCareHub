<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- AutoCare Türkiye hero background: original artwork (replaces a hotlinked third-party photo). -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="38%" r="65%">
      <stop offset="0" stop-color="#3a1c00"/>
      <stop offset="0.45" stop-color="#140b04"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8700" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#FF8700" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M0 640 L1600 520 L1600 900 L0 900 Z" fill="url(#road)"/>
  <g fill="url(#streak)">
    <rect x="-200" y="300" width="1400" height="4" transform="rotate(-4 800 450)"/>
    <rect x="100" y="360" width="1300" height="2" transform="rotate(-4 800 450)"/>
    <rect x="-100" y="430" width="1500" height="6" transform="rotate(-4 800 450)"/>
    <rect x="300" y="500" width="1200" height="3" transform="rotate(-4 800 450)"/>
    <rect x="0" y="575" width="1450" height="2" transform="rotate(-4 800 450)"/>
  </g>
  <g fill="none" stroke="#FF8700" stroke-opacity="0.18" stroke-width="2">
    <circle cx="1180" cy="330" r="160"/>
    <circle cx="1180" cy="330" r="110"/>
    <circle cx="1180" cy="330" r="34"/>
  </g>
</svg>
