<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AutoCare Türkiye</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="u-vh-100 d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-secondary">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <i class="u-orange fa-solid fa-flag-checkered fa-3x mb-3"></i>
                            <h2 class="u-italic fw-bold text-white display-6">JOIN THE CLUB</h2>
                            <p class="text-muted">Sign up for professional care.</p>
                        </div>
                        
                        <form id="registerForm">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="regName" placeholder="Full Name" required>
                                <label for="regName">Full Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                                <label for="regEmail">Email Address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="tel" class="form-control" id="regPhone" placeholder="Phone Number" required>
                                <label for="regPhone">Phone Number</label>
                            </div>
                            <div class="form-floating mb-3">
                                <select class="form-select" id="regCity" required>
                                    <option value="" selected disabled>Select...</option>
                                </select>
                                <label for="regCity">City</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="regPassword" placeholder="Password" minlength="8" maxlength="72" required>
                                <label for="regPassword">Password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 mt-2">
                                <i class="fa-solid fa-arrow-right me-2"></i> REGISTER
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <small class="text-muted">Already a member? <a href="index.html" class="u-orange fw-bold text-decoration-none">Login</a></small>
                        </div>
                        <div class="text-center mt-3">
                             <small><a href="index.html" class="text-muted text-decoration-none hover-orange"><i class="fa-solid fa-arrow-left"></i> Return to Home</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="u-z-toast toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="u-toast-head toast-header border-bottom border-secondary">
                <i class="fa-solid fa-circle-info me-2" id="toastIcon"></i>
                <strong class="me-auto" id="toastTitle">System Message</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="u-toast-body toast-body" id="toastMessage">
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
